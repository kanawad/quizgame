<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Start Screen -->
  <div id="start-screen" class="screen active">
    <div class="card">
      <div class="logo">🧠</div>
      <h1>Quiz Challenge</h1>
      <p class="subtitle">Test your knowledge with 10 mixed-format questions</p>
      <div class="legend">
        <span class="badge single">Single Choice</span>
        <span class="badge multi">Multi Select</span>
        <span class="badge fill">Fill in the Blank</span>
        <span class="badge order">Ordering</span>
      </div>
      <button id="start-btn" class="btn primary">Start Quiz</button>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="screen">
    <div class="quiz-header">
      <div class="progress-info">
        <span id="question-counter">Question 1 / 10</span>
        <span id="question-type-badge" class="badge">Type</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="timer-wrap">
        <span class="timer-icon">⏱</span>
        <span id="timer">60</span>s
      </div>
    </div>

    <div class="card question-card">
      <p id="question-hint" class="hint"></p>
      <h2 id="question-text"></h2>
      <div id="options-container"></div>
      <div id="fill-container" class="hidden">
        <input type="text" id="fill-input" placeholder="Type your answer…" autocomplete="off" />
      </div>
      <div id="order-container" class="hidden"></div>
      <div id="feedback" class="feedback hidden"></div>
    </div>

    <div class="quiz-footer">
      <button id="next-btn" class="btn primary" disabled>Next →</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen">
    <div class="card result-card">
      <div id="result-emoji" class="result-emoji"></div>
      <h2 id="result-title"></h2>
      <p id="result-subtitle"></p>
      <div class="score-ring-wrap">
        <svg class="score-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle id="ring-fill" class="ring-fill" cx="60" cy="60" r="52"/>
        </svg>
        <div class="score-text">
          <span id="score-display">0</span>
          <span class="score-total" id="score-total"></span>
        </div>
      </div>
      <div id="breakdown" class="breakdown"></div>
      <div class="result-actions">
        <button id="review-btn" class="btn secondary">Review Answers</button>
        <button id="restart-btn" class="btn primary">Play Again</button>
      </div>
    </div>
  </div>

  <!-- Review Screen -->
  <div id="review-screen" class="screen">
    <div class="review-header">
      <h2>Answer Review</h2>
      <button id="back-btn" class="btn secondary">← Back to Results</button>
    </div>
    <div id="review-list"></div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
